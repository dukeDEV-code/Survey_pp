name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: SurveyApp
        run: npm install

      - name: Build web assets
        working-directory: SurveyApp
        run: npm run build

      - name: Sync Capacitor
        working-directory: SurveyApp
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: SurveyApp/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: SurveyApp/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyApp-debug
          path: SurveyApp/android/app/build/outputs/apk/debug/app-debug.apk
